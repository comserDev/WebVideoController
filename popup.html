<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WVC 1.3.0</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <strong>WVC 1.3.0</strong>
    <span>웹 비디오 컨트롤러</span>
  </header>

  <main>
    <section class="status-card" aria-live="polite">
      <div class="status-row">
        <span>감지된 비디오</span>
        <strong id="videoCount">-</strong>
      </div>
      <div class="status-row">
        <span>컨트롤러</span>
        <strong id="controllerState">확인 중</strong>
      </div>
    </section>

    <div id="message" class="message">현재 페이지 상태를 확인하고 있습니다.</div>

    <div class="actions">
      <button id="refreshBtn" type="button">새로고침</button>
      <button id="copyBtn" type="button">진단 정보 복사</button>
    </div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
